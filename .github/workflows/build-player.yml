name: Build DisplayHub Player

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            label: linux-x64
            artifact: DisplayHub-Player-Linux-x64
            args: "--bundles deb"
          - platform: ubuntu-24.04-arm
            label: linux-arm64
            artifact: DisplayHub-Player-Linux-ARM64
            args: "--bundles deb"
          - platform: windows-latest
            label: windows-x64
            artifact: DisplayHub-Player-Windows-x64
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.label, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Setup MSYS2 for Windows AirPlay
        if: matrix.label == 'windows-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build bundled UxPlay runtime for Windows
        if: matrix.label == 'windows-x64'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed git mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libplist mingw-w64-ucrt-x86_64-gstreamer mingw-w64-ucrt-x86_64-gst-plugins-base mingw-w64-ucrt-x86_64-gst-plugins-good mingw-w64-ucrt-x86_64-gst-plugins-bad mingw-w64-ucrt-x86_64-gst-libav
          git clone --depth 1 https://github.com/FDH2/UxPlay.git /tmp/uxplay
          cmake -S /tmp/uxplay -B /tmp/uxplay/build -G Ninja -DNO_MARCH_NATIVE=ON -DUSE_DNS_SD=0
          cmake --build /tmp/uxplay/build
          mkdir -p src-tauri/resources/airplay/bin src-tauri/resources/airplay/lib/gstreamer-1.0
          cp /tmp/uxplay/build/uxplay.exe src-tauri/resources/airplay/bin/
          ldd /tmp/uxplay/build/uxplay.exe | awk '/\/ucrt64\// {print $3}' | while read dll; do cp "$dll" src-tauri/resources/airplay/bin/; done
          cp /ucrt64/lib/gstreamer-1.0/*.dll src-tauri/resources/airplay/lib/gstreamer-1.0/

      - name: Generate application icons
        run: npx tauri icon src-tauri/app-icon.svg

      - name: Build installers
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Upload Linux installer
        if: startsWith(matrix.label, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.label == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
